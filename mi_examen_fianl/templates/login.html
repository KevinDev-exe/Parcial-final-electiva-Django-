<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="card mx-auto shadow-sm" style="max-width: 420px;">
      <div class="card-body">
        <h1 class="h4 mb-3">Iniciar sesion</h1>

        {% if form.errors %}
          <div class="alert alert-danger">Usuario o contrasena incorrectos.</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
            {{ form.username }}
          </div>
          <div class="mb-3">
            <label class="form-label" for="{{ form.password.id_for_label }}">Contrasena</label>
            {{ form.password }}
          </div>

          {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
          {% endif %}

          <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </form>

        <p class="mt-3 mb-0 text-center">
          <a href="{% url 'registro' %}">Crear una cuenta</a>
        </p>
      </div>
    </div>
  </main>
</body>
</html>
