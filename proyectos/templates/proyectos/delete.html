{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Eliminar Proyecto</h2>
    <p>¿Estás seguro de que deseas eliminar el proyecto "<strong>{{ object.titulo }}</strong>"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'proyectos:list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
