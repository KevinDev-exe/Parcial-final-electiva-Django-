<h1>Comentarios del Proyecto</h1>

<h2>{{ proyecto.titulo }}</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">
        Agregar comentario
    </button>
</form>

<hr>

<h3>Lista de comentarios</h3>

{% for comentario in comentarios %}

    <div>
        <strong>{{ comentario.usuario }}</strong>
        <br>

        {{ comentario.texto }}

        <br>

        <small>
            {{ comentario.fecha }}
        </small>
    </div>

    <hr>

{% empty %}

<p>No hay comentarios.</p>

{% endfor %}
